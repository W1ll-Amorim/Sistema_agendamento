version: '3.8'

services:
  sistema_agendamento:
    build: .
    container_name: agendamento_v2
    ports:
      - "8000:8000"
    volumes:
      # Mapeia a pasta database local para não perder os dados do SQLite
      - ./database:/app/database
      # Útil para desenvolvimento: atualiza o código em tempo real sem precisar de rebuild
      - .:/app
    environment:
      - TZ=America/Sao_Paulo # Mantém o fuso horário correto
      # Puxa a URL segura sem expor a senha no código
      - SQLALCHEMY_DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      # Puxa as credenciais do .env para criar o banco
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: