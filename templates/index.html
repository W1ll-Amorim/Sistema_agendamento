<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <title>Stellare Kitchens - Login</title>
</head>
<body>
    <script>
        // Limpar sessão ao acessar a página de login (usuário voltou pelo botão do navegador)
        localStorage.removeItem('token');
        localStorage.removeItem('id_usuario');
        localStorage.removeItem('email');
    </script>

    <div class="login_box">
        <h2> Nexus </h2>
        
        <form id="loginForm">
            <h3>Bem-vindo de volta!</h3>
            
            <input type="email" id="email" name="email" placeholder="E-mail" required><br>

          <div class="senha-container">
    <input type="password" id="senha" name="senha" placeholder="Senha" required>
    <span class="toggle-senha" onclick="toggleSenha()" title="Mostrar/Ocultar senha">
        <!-- Olho aberto (começa oculto) -->
        <svg id="icone-olho-aberto" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>

        <!-- Olho riscado (começa visível quando a senha está oculta) -->
        <svg id="icone-olho-fechado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
    </span>
</div>

            <div class="lembrar-container">
                <input type="checkbox" id="remember">
                <label for="remember">Lembrar senha</label>
            </div>
            
            <input type="submit" value="Entrar">
        </form>

        <a href="/cadastro" class="link-cadastro">
            Não tem uma conta? <span>Cadastre-se</span>
        </a>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
