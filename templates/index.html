<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <title>Stellare Kitchens - Login</title>
</head>
<body>
    <div class="login_box">
        <h2> Stellare Kitchens </h2>
        
        <form id="loginForm">
            <h3>Bem-vindo de volta!</h3>
            
            <input type="email" id="email" name="email" placeholder="E-mail" required><br>

            <div class="senha-container">
                <input type="password" id="senha" name="senha" placeholder="Senha" required>
                <span class="toggle-senha" onclick="toggleSenha()">👁️</span>
            </div>

            <div class="lembrar-container">
                <input type="checkbox" id="remember">
                <label for="remember">Lembrar senha</label>
            </div>
            
            <input type="submit" value="Entrar">
        </form>

        <a href="/cadastro" class="link-cadastro">
            Não tem uma conta? <span>Cadastre-se</span>
        </a>
    </div>

    <!-- 🔥 JS separado -->
    <script src="/static/js/login.js"></script>
</body>
</html>
